name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Testes com planilha sintética; o teste com a V4 real é pulado (dados não ficam no repositório)
      - run: npm test
      - run: npm run build
      # E2E exige a V4 privada (rodar localmente: npm run test:e2e)
